<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 O「社員証（しゃいんしょう）」〔牛头系列・自嘲〕：一张挂在挂绳夹上的工牌，照片栏里是一头牛，
       头衔那一行是琥珀色（= 「高级」）。打工人每天挂在胸前的东西，自嘲但体面。
       细节多，16px 请改用 logo-o-16.svg。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <!-- 工牌 -->
  <rect x="5" y="4.5" width="22" height="26" rx="3.5" style="fill: var(--logo-base, #3778d7)"/>
  <!-- 挂绳夹 -->
  <rect x="12.5" y="1.5" width="7" height="4.5" rx="1.5" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <rect x="14" y="6.8" width="4" height="1.4" rx="0.7" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 照片栏 -->
  <rect x="8.5" y="9.5" width="15" height="12.5" rx="2" style="fill: var(--logo-ink, #ffffff)"/>
  <!-- 照片中的牛头 -->
  <path d="M13.6 13.6C12.2 13.4 11.2 12.5 10.9 11C12.1 11.9 13.2 12.3 14.4 12.5Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <path d="M18.4 13.6C19.8 13.4 20.8 12.5 21.1 11C19.9 11.9 18.8 12.3 17.6 12.5Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <path d="M13.5 14.2L10.6 14C10.9 15.3 11.8 16 13.6 16Z" style="fill: var(--logo-base, #3778d7)"/>
  <path d="M18.5 14.2L21.4 14C21.1 15.3 20.2 16 18.4 16Z" style="fill: var(--logo-base, #3778d7)"/>
  <rect x="13" y="12.4" width="6" height="7.2" rx="2" style="fill: var(--logo-base, #3778d7)"/>
  <rect x="12.6" y="17" width="6.8" height="4.2" rx="2.1" style="fill: var(--logo-mid, #6d9adc)"/>
  <circle cx="14.7" cy="19.1" r="0.6" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <circle cx="17.3" cy="19.1" r="0.6" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 姓名行与头衔行 -->
  <rect x="8.5" y="24" width="15" height="2" rx="1" style="fill: var(--logo-ink, #ffffff)" fill-opacity="0.9"/>
  <rect x="8.5" y="27" width="9" height="1.6" rx="0.8" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
