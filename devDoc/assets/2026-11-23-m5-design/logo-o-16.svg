<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- 方案 O「社員証」的 16px 简化版：去掉照片栏与姓名行，牛头直接画在工牌上、放大到占满；保留挂绳夹与琥珀色头衔条。
       用于 16 / 20 / 24px。逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <rect x="1.5" y="2" width="13" height="13.5" rx="2" style="fill: var(--logo-base, #3778d7)"/>
  <rect x="6" y="0.5" width="4" height="2.5" rx="0.8" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 牛头（反白） -->
  <g style="fill: var(--logo-ink, #ffffff)">
    <path d="M6 6.3C4.6 6.1 3.7 5.2 3.5 3.9C4.6 4.6 5.6 4.9 6.6 5Z"/>
    <path d="M10 6.3C11.4 6.1 12.3 5.2 12.5 3.9C11.4 4.6 10.4 4.9 9.4 5Z"/>
    <rect x="5.5" y="5" width="5" height="6.5" rx="1.8"/>
  </g>
  <circle cx="7" cy="9.6" r="0.65" style="fill: var(--logo-base, #3778d7)"/>
  <circle cx="9" cy="9.6" r="0.65" style="fill: var(--logo-base, #3778d7)"/>
  <rect x="4.5" y="12.8" width="7" height="1.3" rx="0.65" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
