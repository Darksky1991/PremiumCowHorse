<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 K「一筆牛（ひとふでうし）」〔牛头系列・单线〕：一笔从左角画到右角，中间顺势勾出脸与口鼻；
       耳朵、鼻孔、眼睛是另外几笔小点画。等宽线条、无底板，与 lucide 线性图标同一语言。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <g fill="none" style="stroke: var(--logo-base, #3778d7)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 一笔：左角 → 脸左侧 → 口鼻 → 脸右侧 → 右角 -->
    <path d="M3.5 3.5C4.5 7.5 7 9.5 10.5 9.5C9.6 13 9.4 16 9.6 19C9.6 24.8 12.4 28 16 28C19.6 28 22.4 24.8 22.4 19C22.6 16 22.4 13 21.5 9.5C25 9.5 27.5 7.5 28.5 3.5"/>
    <!-- 耳 -->
    <path d="M9.8 12.6C7.5 12.2 5 12.8 3.8 14.4C5.6 15.6 8 15.6 9.7 14.8"/>
    <path d="M22.2 12.6C24.5 12.2 27 12.8 28.2 14.4C26.4 15.6 24 15.6 22.3 14.8"/>
    <!-- 口鼻的上缘 -->
    <path d="M11.2 20.4Q16 19 20.8 20.4"/>
  </g>
  <g style="fill: var(--logo-base, #3778d7)">
    <circle cx="13.6" cy="23.6" r="1.3"/>
    <circle cx="18.4" cy="23.6" r="1.3"/>
    <circle cx="13.2" cy="14.8" r="1.1"/>
    <circle cx="18.8" cy="14.8" r="1.1"/>
  </g>
  <!-- 耳标 -->
  <rect x="24.4" y="15.6" width="3" height="3.4" rx="0.7" style="fill: var(--logo-accent, #e8a21f)"/>
</svg>
