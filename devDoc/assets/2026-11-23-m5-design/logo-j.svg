<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 J「牛面（ぎゅうめん）」〔牛头系列・正面几何〕：左右对称的几何牛头，角、耳、口鼻都是简单形。
       右耳挂一枚琥珀色耳标：牛的耳标 = 打工人的工牌（自嘲，但不失体面）。无底板。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <!-- 角 -->
  <path d="M11 8.5C8.5 8 6 6.5 4.5 2.5C7.5 4.2 10 5.2 12.5 5.8Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <path d="M21 8.5C23.5 8 26 6.5 27.5 2.5C24.5 4.2 22 5.2 19.5 5.8Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 耳 -->
  <path d="M8.6 11L2 10.2C2.6 12.8 4.6 14.6 8.8 14.6Z" style="fill: var(--logo-base, #3778d7)"/>
  <path d="M23.4 11L30 10.2C29.4 12.8 27.4 14.6 23.2 14.6Z" style="fill: var(--logo-base, #3778d7)"/>
  <!-- 脸 -->
  <path d="M10.5 6.5H21.5A3.5 3.5 0 0 1 25 10L23.6 19H8.4L7 10A3.5 3.5 0 0 1 10.5 6.5Z" style="fill: var(--logo-base, #3778d7)"/>
  <!-- 口鼻 -->
  <rect x="7" y="17" width="18" height="12" rx="6" style="fill: var(--logo-mid, #6d9adc)"/>
  <ellipse cx="12.2" cy="23" rx="1.5" ry="2" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <ellipse cx="19.8" cy="23" rx="1.5" ry="2" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 眼 -->
  <circle cx="12" cy="12.5" r="1.4" style="fill: var(--logo-ink, #ffffff)"/>
  <circle cx="20" cy="12.5" r="1.4" style="fill: var(--logo-ink, #ffffff)"/>
  <!-- 耳标 -->
  <rect x="26" y="12.6" width="3.2" height="3.6" rx="0.7" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
