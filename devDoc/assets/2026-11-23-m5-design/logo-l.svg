<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 L「影牛（かげうし）」〔牛头系列・剪影 + 负形〕：底板上的白色牛头剪影，眼睛与鼻孔是挖空的负形（露出底板色）。
       底板保证在深 / 浅任务栏上都有完整轮廓；剪影用的是 J 的几何形，缩放到底板内。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <defs>
    <linearGradient id="l-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--logo-base, #3778d7)"/>
      <stop offset="1" style="stop-color: var(--logo-base-2, #2a5fb7)"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#l-tile)"/>
  <g transform="translate(16 16.6) scale(0.8) translate(-16 -16)">
    <g style="fill: var(--logo-ink, #ffffff)">
      <path d="M11 8.5C8.5 8 6 6.5 4.5 2.5C7.5 4.2 10 5.2 12.5 5.8Z"/>
      <path d="M21 8.5C23.5 8 26 6.5 27.5 2.5C24.5 4.2 22 5.2 19.5 5.8Z"/>
      <path d="M8.6 11L2 10.2C2.6 12.8 4.6 14.6 8.8 14.6Z"/>
      <path d="M23.4 11L30 10.2C29.4 12.8 27.4 14.6 23.2 14.6Z"/>
      <path d="M10.5 6.5H21.5A3.5 3.5 0 0 1 25 10L23.6 19H8.4L7 10A3.5 3.5 0 0 1 10.5 6.5Z"/>
      <rect x="7" y="17" width="18" height="12" rx="6"/>
    </g>
    <!-- 负形：眼、鼻孔、口鼻上缘 -->
    <g style="fill: var(--logo-base-2, #2a5fb7)">
      <circle cx="12" cy="12.5" r="1.6"/>
      <circle cx="20" cy="12.5" r="1.6"/>
      <ellipse cx="12.2" cy="23.2" rx="1.7" ry="2.2"/>
      <ellipse cx="19.8" cy="23.2" rx="1.7" ry="2.2"/>
    </g>
    <path d="M9.5 18.2Q16 16.6 22.5 18.2" fill="none" style="stroke: var(--logo-base-2, #2a5fb7)" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="26" y="12.6" width="3.2" height="3.6" rx="0.7" style="fill: var(--logo-accent, #f9b73f)"/>
  </g>
</svg>
