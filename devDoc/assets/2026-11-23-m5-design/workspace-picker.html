      /* ---------- 动效令牌（与 design-notes.md 第 5 节一致；CSS 近似 motion 的弹簧） ---------- */
      :root {
        --dur-fast: 120ms;
        --dur-base: 200ms;
        --dur-slow: 280ms;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --ease-enter: cubic-bezier(0.05, 0.7, 0.1, 1);
        --ease-exit: cubic-bezier(0.3, 0, 0.8, 0.15);
        /* spring.ring ≈ { type: 'spring', visualDuration: 0.26, bounce: 0 } */
        --ease-ring: cubic-bezier(0.22, 0.9, 0.24, 1);
        --dur-ring: 260ms;
      }
      .reduced {
        --dur-fast: 0ms;
        --dur-base: 120ms;
        --dur-slow: 120ms;
        --dur-ring: 0ms;
      }
      @media (prefers-reduced-motion: reduce) {
        :root {
          --dur-fast: 0ms;
          --dur-base: 120ms;
          --dur-slow: 120ms;
          --dur-ring: 0ms;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family:
          'Segoe UI Variable Text', 'Segoe UI', 'Yu Gothic UI', 'Meiryo UI', 'Microsoft YaHei UI',
          system-ui, sans-serif;
        font-size: 13px;
        background: oklch(0.3 0 0);
        color: #eee;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ---------- 原型控制条（不属于设计） ---------- */
      .proto {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 8px 16px;
        background: #1a1a1a;
        color: #ccc;
        font-size: 12px;
        border-bottom: 1px solid #000;
      }
      .proto b {
        color: #fff;
        font-weight: 600;
        margin-right: 4px;
      }
      .proto label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .proto .seg {
        display: inline-flex;
        border: 1px solid #444;
        border-radius: 6px;
        overflow: hidden;
      }
      .proto .seg button {
        background: none;
        border: 0;
        padding: 3px 10px;
        cursor: pointer;
        color: #bbb;
      }
      .proto .seg button[aria-pressed='true'] {
        background: #444;
        color: #fff;
      }
      .proto select {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 2px 6px;
      }
      .proto .note {
        color: #888;
        margin-left: auto;
      }

      /* ---------- 应用外壳（模拟） ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        overflow: hidden;
      }
      .titlebar {
        height: 36px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding-left: 8px;
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        border-bottom: 1px solid var(--border);
      }
      .appmark {
        width: 16px;
        height: 16px;
        margin: 0 4px;
        flex: none;
      }
      .appname {
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-right: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: none;
        cursor: default;
        white-space: nowrap;
        transition: background-color var(--dur-fast) var(--ease-standard);
      }
      .btn:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .btn:focus-visible,
      .ctl:focus-visible,
      .row:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .btn.icon {
        width: 28px;
        padding: 0;
        justify-content: center;
      }
      .btn.outline {
        border-color: var(--border);
        background: var(--background);
      }
      .wsbtn {
        max-width: 240px;
        color: var(--sidebar-foreground);
        font-weight: 500;
      }
      .wsbtn .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--c, var(--muted-foreground));
        box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 12%, transparent);
      }
      .dot.none {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--muted-foreground);
      }
      .searchbox {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 0 16px;
        min-width: 0;
      }
      .searchbox .btn {
        width: 100%;
        max-width: 420px;
        justify-content: space-between;
        color: var(--muted-foreground);
        height: 26px;
      }
      kbd {
        font-family: inherit;
        font-size: 11px;
        line-height: 16px;
        min-width: 18px;
        padding: 0 4px;
        text-align: center;
        border-radius: 4px;
        background: var(--muted);
        color: var(--muted-foreground);
        border: 1px solid var(--border);
      }
      .winbtns {
        display: flex;
        height: 100%;
        margin-left: 4px;
      }
      .winbtns span {
        width: 46px;
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
      }

      .body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .activity {
        width: 44px;
        flex: none;
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding-top: 6px;
        color: var(--muted-foreground);
      }
      .activity span {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 6px;
      }
      .activity span.on {
        color: var(--sidebar-foreground);
        background: var(--sidebar-accent);
      }
      .sidebar {
        width: 250px;
        flex: none;
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        padding: 8px 6px;
        overflow: hidden;
      }
      .sidebar h4 {
        margin: 2px 8px 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .tree div {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tree div.sel {
        background: var(--sidebar-accent);
        color: var(--sidebar-accent-foreground);
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .tabs {
        height: 34px;
        display: flex;
        align-items: end;
        gap: 2px;
        padding: 0 8px;
        background: var(--sidebar);
        border-bottom: 1px solid var(--border);
      }
      .tab {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-radius: 6px 6px 0 0;
        color: var(--muted-foreground);
      }
      .tab.on {
        background: var(--background);
        color: var(--foreground);
        box-shadow: 0 0 0 1px var(--border);
      }
      .addr {
        height: 36px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
        color: var(--muted-foreground);
      }
      .addr .crumb {
        color: var(--foreground);
      }
      .log {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 10px 16px;
        overflow: hidden;
        font:
          12.5px/1.65 'Cascadia Mono',
          'BIZ UDGothic',
          Consolas,
          monospace;
        color: var(--foreground);
        white-space: pre;
      }
      .log .t {
        color: var(--log-time);
      }
      .log .e {
        color: var(--log-error);
        font-weight: 600;
      }
      .log .w {
        color: var(--log-warn);
        font-weight: 600;
      }
      .log .n {
        color: var(--log-info);
      }

      /* ---------- 选择器 ---------- */
      .scrim {
        position: absolute;
        inset: 36px 0 0 0;
        z-index: 10;
        background: oklch(0.1 0.01 260 / 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-base) var(--ease-standard);
      }
      .dark .scrim {
        background: oklch(0 0 0 / 0.45);
      }
      .open .scrim {
        opacity: 1;
        pointer-events: auto;
      }
      .panel {
        position: absolute;
        z-index: 11;
        top: 44px;
        left: 50%;
        width: min(880px, calc(100% - 32px));
        margin-left: calc(min(880px, calc(100% - 32px)) / -2);
        background: var(--popover);
        color: var(--popover-foreground);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow:
          0 24px 48px -12px oklch(0 0 0 / 0.35),
          0 2px 6px oklch(0 0 0 / 0.08);
        display: flex;
        flex-direction: column;
        opacity: 0;
        transform: translateY(-8px) scale(0.985);
        pointer-events: none;
        visibility: hidden;
        transition:
          opacity var(--dur-fast) var(--ease-exit),
          transform var(--dur-fast) var(--ease-exit),
          visibility 0s linear var(--dur-fast);
      }
      .open .panel {
        opacity: 1;
        transform: none;
        pointer-events: auto;
        visibility: visible;
        transition:
          opacity var(--dur-base) var(--ease-enter),
          transform var(--dur-slow) var(--ease-enter),
          visibility 0s;
      }
      .phead {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .filter {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--input);
        background: var(--background);
        color: var(--muted-foreground);
      }
      .filter:focus-within {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 35%, transparent);
      }
      .filter input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        color: var(--foreground);
      }
      .filter input::placeholder {
        color: var(--muted-foreground);
      }
      .count {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        white-space: nowrap;
      }
      .seg2 {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--muted);
      }
      .seg2 button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--muted-foreground);
        cursor: default;
      }
      .seg2 button[aria-pressed='true'] {
        background: var(--background);
        color: var(--foreground);
        box-shadow: 0 1px 2px oklch(0 0 0 / 0.12);
      }
      .seg2 button:focus-visible {
        outline: 2px solid var(--ring);
      }
      .sw {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        cursor: default;
        user-select: none;
      }
      .sw button {
        width: 30px;
        height: 18px;
        border-radius: 9px;
        border: 0;
        padding: 2px;
        background: var(--input);
        position: relative;
        transition: background-color var(--dur-fast) var(--ease-standard);
      }
      .sw button::after {
        content: '';
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--background);
        box-shadow: 0 1px 2px oklch(0 0 0 / 0.2);
        transition: transform var(--dur-fast) var(--ease-standard);
      }
      .sw button[aria-checked='true'] {
        background: var(--primary);
      }
      .sw button[aria-checked='true']::after {
        transform: translateX(12px);
        background: var(--primary-foreground);
      }
      .sw button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .sw.edit button[aria-checked='true'] {
        background: var(--ws-amber);
      }

      .stage {
        --cw: 204px;
        --ch: 176px;
        position: relative;
        height: 286px;
        perspective: 1150px;
        perspective-origin: 50% 40%;
        overflow: hidden;
        touch-action: none;
      }
      .detail .stage {
        --cw: 244px;
        --ch: 304px;
        height: 404px;
      }
      .editing .stage {
        --cw: 244px;
        --ch: 304px;
        height: 404px;
      }
      .stage::before {
        /* 地面：只用一层很淡的椭圆让 3D 有落脚点 */
        content: '';
        position: absolute;
        left: 50%;
        bottom: 26px;
        width: 70%;
        height: 46px;
        transform: translateX(-50%);
        background: radial-gradient(
          closest-side,
          color-mix(in oklch, var(--foreground) 9%, transparent),
          transparent
        );
        pointer-events: none;
      }
      .ring {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      } /* 3D 中位于 z<0 的卡片会被 z=0 的容器挡住命中测试 */
      .ring .card {
        pointer-events: auto;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 46%;
        width: var(--cw);
        height: var(--ch);
        margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
        transform-style: preserve-3d;
        cursor: default;
        transition:
          transform var(--dur-ring) var(--ease-ring),
          opacity var(--dur-base) var(--ease-standard),
          width var(--dur-slow) var(--ease-standard),
          height var(--dur-slow) var(--ease-standard),
          margin var(--dur-slow) var(--ease-standard);
        will-change: transform, opacity;
      }
      .card.nojump {
        transition: none !important;
      }
      .card.side:hover .face.f {
        border-color: color-mix(in oklch, var(--foreground) 30%, var(--border));
      }
      .card.side .face.f::after {
        /* 侧面卡片稍暗，正面卡片明确 */
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--popover);
        opacity: var(--dim, 0);
        pointer-events: none;
        transition: opacity var(--dur-base) var(--ease-standard);
      }
      .inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform var(--dur-slow) var(--ease-standard);
      }
      .flipped .inner {
        transform: rotateY(180deg);
      }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .face.b {
        transform: rotateY(180deg);
        padding: 18px 16px 14px;
        gap: 10px;
      }
      .reduced .inner,
      .reduced .card {
        transition-property: opacity;
      }
      .reduced .flipped .inner {
        transform: none;
      }
      .reduced .flipped .face.f {
        visibility: hidden;
      }
      .reduced .face.b {
        transform: none;
        visibility: hidden;
      }
      .reduced .flipped .face.b {
        visibility: visible;
      }
      .card.front .face.f,
      .card.front .face.b {
        border-color: color-mix(in oklch, var(--primary) 70%, var(--border));
        box-shadow:
          0 0 0 1px color-mix(in oklch, var(--primary) 70%, transparent),
          0 18px 36px -14px oklch(0 0 0 / 0.4);
      }
      .band {
        height: 5px;
        flex: none;
        background: var(--c, var(--border));
      }
      .cbody {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px 12px;
      }
      .ctop {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 18px;
      }
      .pill {
        margin-left: auto;
        font-size: 11px;
        line-height: 18px;
        padding: 0 7px;
        border-radius: 9px;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .pill.cur {
        border-color: transparent;
        background: color-mix(in oklch, var(--primary) 14%, transparent);
        color: var(--foreground);
      }
      .name {
        font-size: 16px;
        line-height: 1.35;
        font-weight: 600;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .detail .name {
        font-size: 15px;
        -webkit-line-clamp: 2;
      }
      .name mark {
        background: none;
        color: inherit;
        text-decoration: underline 2px color-mix(in oklch, var(--primary) 80%, transparent);
        text-underline-offset: 3px;
      }
      .meta {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .meta .row2 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .desc {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted-foreground);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .entries {
        list-style: none;
        margin: 4px 0 0;
        padding: 8px 0 0;
        border-top: 1px dashed var(--border);
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12px;
      }
      .entries li {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .entries li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .entries li.more {
        color: var(--muted-foreground);
        padding-left: 22px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 5px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .card:not(.front) .hint {
        visibility: hidden;
      }
      .newcard .face.f {
        border-style: dashed;
        border-width: 1.5px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted-foreground);
        background: var(--card);
      }
      .newcard .face.f svg {
        width: 28px;
        height: 28px;
      }

      /* 编辑模式的正面卡片 */
      .form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px 12px;
        flex: 1;
        min-height: 0;
      }
      .form label {
        font-size: 11px;
        color: var(--muted-foreground);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .form input[type='text'],
      .form textarea {
        width: 100%;
        border: 1px solid var(--input);
        border-radius: 6px;
        background: var(--background);
        padding: 5px 8px;
        outline: 0;
        resize: none;
        font-size: 12.5px;
      }
      .form input[type='text'] {
        font-size: 14px;
        font-weight: 600;
      }
      .form input:focus,
      .form textarea:focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .swatches button {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        background: var(--c);
        cursor: default;
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 15%, transparent);
      }
      .swatches button.none {
        background: none;
        box-shadow: inset 0 0 0 1.5px var(--muted-foreground);
        position: relative;
      }
      .swatches button.none::after {
        content: '';
        position: absolute;
        left: 8px;
        top: 2px;
        width: 1.5px;
        height: 14px;
        background: var(--muted-foreground);
        transform: rotate(45deg);
      }
      .swatches button[aria-checked='true'] {
        box-shadow:
          0 0 0 2px var(--card),
          0 0 0 3.5px var(--foreground);
      }
      .swatches button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .ffoot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .ffoot .btn {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        margin-left: auto;
        color: var(--destructive);
      }
      .ffoot .btn:hover {
        background: color-mix(in oklch, var(--destructive) 12%, transparent);
        color: var(--destructive);
      }
      .linkbtn {
        border: 0;
        background: none;
        padding: 0;
        color: var(--primary);
        cursor: default;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .face.b h3 {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
      }
      .face.b p {
        margin: 0;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted-foreground);
      }
      .face.b .acts {
        margin-top: auto;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn.solid-d {
        background: var(--destructive);
        color: oklch(0.985 0 0);
      }
      .btn.solid-d:hover {
        background: color-mix(in oklch, var(--destructive) 88%, black);
        color: oklch(0.985 0 0);
      }

      .indicator {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
      }
      .indicator button {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--border);
        cursor: default;
        transition:
          background-color var(--dur-fast),
          transform var(--dur-fast) var(--ease-standard);
      }
      .indicator button.on {
        background: var(--foreground);
        transform: scale(1.3);
      }
      .indicator button.cur {
        box-shadow: 0 0 0 1.5px var(--primary);
      }
      .indicator .tip {
        margin-left: 10px;
      }

      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 10px;
        color: var(--muted-foreground);
      }
      .empty strong {
        color: var(--foreground);
        font-weight: 600;
        font-size: 14px;
      }

      /* 列表视图 */
      .list {
        list-style: none;
        margin: 0;
        padding: 6px;
        max-height: 392px;
        min-height: 200px;
        overflow-y: auto;
      }
      .row {
        display: grid;
        grid-template-columns: 4px 22px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        padding: 7px 10px 7px 0;
        border-radius: 8px;
        cursor: default;
      }
      .row .bar {
        align-self: stretch;
        border-radius: 0 3px 3px 0;
        background: var(--c, transparent);
      }
      .row .nm {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .sub {
        font-size: 12px;
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .tm {
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .row:hover {
        background: color-mix(in oklch, var(--accent) 60%, transparent);
      }
      .row.on {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .pfoot {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 14px;
        padding: 9px 14px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .pfoot .k {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .pfoot .manage {
        margin-left: auto;
      }
      .pfoot .editnote {
        color: var(--foreground);
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .pfoot .editnote::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--ws-amber);
      }

      .toast {
        position: absolute;
        z-index: 20;
        right: 16px;
        bottom: 16px;
        padding: 9px 14px;
        border-radius: 8px;
        background: var(--popover);
        color: var(--popover-foreground);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px -8px oklch(0 0 0 / 0.35);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity var(--dur-base) var(--ease-standard),
          transform var(--dur-base) var(--ease-standard);
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .press {
        animation: press var(--dur-base) var(--ease-standard);
      }
      @keyframes press {
        40% {
          scale: 0.975;
        }
      }
    </style>

            ([t, c, l, m]) =>
              '<span class="t">' + t + '</span> <span class="' + c + '">' + l + '</span> ' + esc(m)
          )
          .join('\n')
      }

      // ---------- 打开 / 关闭 ----------
      function openPicker(trigger) {
        if (S.open) return
        S.open = true
        S.trigger = trigger || $('wsBtn')
        S.filter = ''
        S.flipped = null
        $('filter').value = ''
        $('app').classList.add('open')
        $('wsBtn').setAttribute('aria-expanded', 'true')
        rebuild(true)
        const v = visible()
        S.pos = Math.max(
          0,
          v.findIndex((w) => w.id === S.currentId)
        )
        layout({ reveal: true })
        requestAnimationFrame(() => requestAnimationFrame(() => layout()))
        S.frontSince = performance.now()
        setTimeout(() => $('filter').focus(), 0)
      }
      function closePicker() {
        if (!S.open) return
        S.open = false
        $('app').classList.remove('open')
        $('wsBtn').setAttribute('aria-expanded', 'false')
        if (S.trigger) S.trigger.focus()
      }
      function commit(w) {
        if (!w || w.id === '__new') return
        const el = cardEls.get(w.id)
        if (el) {
          el.classList.remove('press')
          void el.offsetWidth
          el.classList.add('press')
        }
        const changed = w.id !== S.currentId
        setTimeout(
          () => {
            S.currentId = w.id
            renderShell()
            closePicker()
            if (changed) toast('「' + displayName(w) + '」に切り替えました')
          },
          matchMedia('(prefers-reduced-motion: reduce)').matches ||
            $('app').classList.contains('reduced')
            ? 0
            : 140
        )
      }

      // ---------- 圆环 ----------
      function rebuild(resetPos) {
        const v = visible()
        const ring = $('ring')
        // 复用已有卡片元素（键为工作区 id），新出现的才创建
        const keep = new Set(v.map((w) => w.id))
        for (const [id, el] of cardEls)
          if (!keep.has(id)) {
            el.remove()
            cardEls.delete(id)
          }
        v.forEach((w) => {
          let el = cardEls.get(w.id)
          if (!el) {
            el = document.createElement('div')
            el.className = 'card' + (w.id === '__new' ? ' newcard' : '')
            el.id = 'card-' + w.id
            el.setAttribute('role', 'option')
            el.innerHTML =
              '<div class="inner"><div class="face f"></div><div class="face b"></div></div>'
            el.addEventListener('click', (e) => onCardClick(e, w.id))
            ring.appendChild(el)
            cardEls.set(w.id, el)
            el._d = undefined
          }
          el._front = null // 强制重绘内容
        })
        if (resetPos && S.filter && S._best)
          S.pos = Math.max(
            0,
            v.findIndex((w) => w.id === S._best)
          )
        S.pos = Math.min(S.pos, Math.max(0, v.length - 1))
        renderList()
        layout()
        renderCount()
      }

      function wrapDelta(i, pos, n) {
        let d = i - pos
        if (n > 1) {
          d = ((d % n) + n) % n
          if (d > n / 2) d -= n
        }
        return d
      }

      function layout(opt = {}) {
        const v = visible()
        const n = v.length
        const cw = parseFloat(getComputedStyle($('stage')).getPropertyValue('--cw')) || 196
        const R = cw * 2.15
        const step = opt.reveal ? STEP_DEG * 0.45 : STEP_DEG
        $('empty').hidden = n > 0
        if (n === 0) renderEmpty()
        v.forEach((w, i) => {
          const el = cardEls.get(w.id)
          if (!el) return
          const d = wrapDelta(i, S.pos, n)
          const ad = Math.abs(d)
          const shown = ad <= MAX_D
          const dc = shown ? d : Math.sign(d) * (MAX_D + 1)
          const a = dc * step,
            rad = (a * Math.PI) / 180
          const x = Math.sin(rad) * R,
            z = (Math.cos(rad) - 1) * R
          const op = opt.reveal ? (ad === 0 ? 1 : 0) : shown ? 1 : 0
          const tf =
            'translate3d(' +
            x.toFixed(1) +
            'px,0,' +
            z.toFixed(1) +
            'px) rotateY(' +
            (a * TILT).toFixed(2) +
            'deg)'
          const jump =
            el._d !== undefined && Math.abs(d - el._d) > 1.5 && (shown || Math.abs(el._d) <= MAX_D)
          if (jump) {
            // 绕环跳转（例如 3 张时最左的卡转到最右）：不穿过正面，淡出后在新位置淡入
            el.classList.add('nojump')
            el.style.opacity = '0'
            el.style.transform = tf
            void el.offsetWidth
            el.classList.remove('nojump')
          } else {
            el.style.transform = tf
          }
          el.style.opacity = op
          el.style.zIndex = String(10 - ad)
          el.style.pointerEvents = shown ? '' : 'none'
          el.style.setProperty('--dim', [0, 0.28, 0.62][ad] ?? 0.62)
          el.classList.toggle('front', d === 0)
          el.classList.toggle('side', d !== 0)
          el.setAttribute('aria-selected', d === 0 ? 'true' : 'false')
          el.setAttribute('aria-hidden', shown ? 'false' : 'true')
          el._d = d
          const isFront = d === 0
          if (el._front !== isFront || el._detail !== S.detail || el._edit !== S.edit) {
            el._front = isFront
            el._detail = S.detail
            el._edit = S.edit
            renderCard(el, w, isFront)
          }
          if (!isFront && el.classList.contains('flipped')) el.classList.remove('flipped')
        })
        const front = v[S.pos]
        $('filter').setAttribute(
          'aria-activedescendant',
          front ? (S.view === 'ring' ? 'card-' : 'row-') + front.id : ''
        )
        renderIndicator(v)
        renderFoot()
        ;[...$('list').children].forEach((li, i) => {
          li.classList.toggle('on', i === S.pos)
          li.setAttribute('aria-selected', i === S.pos ? 'true' : 'false')
        })
        const on = $('list').children[S.pos]
        if (on && S.view === 'list') on.scrollIntoView({ block: 'nearest' })
      }

      function highlight(name) {
        if (!S.filter) return esc(name)
        const q = norm(S.filter.trim()),
          n = norm(name)
        const i = n.indexOf(q)
        if (i < 0 || n.length !== name.length) return esc(name)
        return (
          esc(name.slice(0, i)) +
          '<mark>' +
          esc(name.slice(i, i + q.length)) +
          '</mark>' +
          esc(name.slice(i + q.length))
        )
      }

      function renderCard(el, w, isFront) {
        const f = el.querySelector('.face.f'),
          b = el.querySelector('.face.b')
        if (w.id === '__new') {
          f.innerHTML =
            svg('plus') +
            '<span>新しいワークスペース</span>' +
            (isFront ? '<span style="font-size:11.5px">Enter で作成</span>' : '')
          el.setAttribute('aria-label', '新しいワークスペースを作成')
          return
        }
        const idx = S.list.indexOf(w)
        const num = !S.filter && !S.edit && idx < 9 ? idx + 1 : null
        const cur = w.id === S.currentId
        const band =
          '<div class="band" style="' +
          (w.color ? '--c:var(--ws-' + w.color + ')' : '') +
          '"></div>'
        el.setAttribute(
          'aria-label',
          (num ? num + '. ' : '') +
            displayName(w) +
            (cur ? '（使用中）' : '') +
            '、最終使用 ' +
            rel(w.last)
        )
        if (S.edit && isFront) {
          const isDefault = w.id === 'default'
          f.innerHTML =
            band +
            '<div class="form">' +
            '<label>名前<input type="text" data-f="name" value="' +
            esc(w.name) +
            '" placeholder="デフォルト" maxlength="80"></label>' +
            (isDefault && w.name !== ''
              ? '<button class="linkbtn" data-act="restore">既定の名前に戻す</button>'
              : '') +
            '<label>説明<textarea data-f="desc" rows="' +
            (S.detail ? 4 : 2) +
            '" placeholder="案件の概要、環境、連絡先など">' +
            esc(w.desc || '') +
            '</textarea></label>' +
            '<label>色<span class="swatches" role="radiogroup" aria-label="色">' +
            '<button class="none" role="radio" aria-checked="' +
            !w.color +
            '" data-color="" title="なし" aria-label="なし"></button>' +
            Object.entries(WS)
              .map(
                ([k, c]) =>
                  '<button role="radio" aria-checked="' +
                  (w.color === k) +
                  '" data-color="' +
                  k +
                  '" title="' +
                  c.ja +
                  '" aria-label="' +
                  c.ja +
                  '" style="--c:var(--ws-' +
                  k +
                  ')"></button>'
              )
              .join('') +
            '</span></label>' +
            '<div class="ffoot"><span>変更は自動で保存されます</span>' +
            (isDefault
              ? ''
              : '<button class="btn" data-act="delete">' +
                svg('trash', 'width:14px;height:14px') +
                '削除…</button>') +
            '</div></div>'
          b.innerHTML =
            '<h3>「' +
            esc(displayName(w)) +
            '」を削除しますか？</h3><p>ワークスペースと登録した ' +
            w.count +
            ' 項目だけを削除します。ディスク上のファイルやフォルダーは削除されません。</p>' +
            '<div class="acts"><button class="btn outline" data-act="cancel">キャンセル</button><button class="btn solid-d" data-act="confirm">削除</button></div>'
          wireForm(el, w)
          return
        }
        const top =
          '<div class="ctop">' +
          (num ? '<kbd>' + num + '</kbd>' : '') +
          (cur ? '<span class="pill cur">使用中</span>' : '') +
          '</div>'
        const name = '<div class="name">' + highlight(displayName(w)) + '</div>'
        let mid = '',
          meta
        if (S.detail) {
          mid =
            (w.desc
              ? '<p class="desc">' + esc(w.desc) + '</p>'
              : '<p class="desc" style="font-style:italic;opacity:.8">説明なし</p>') +
            '<ul class="entries">' +
            w.entries
              .slice(0, 4)
              .map(
                (e) => '<li>' + fileIcon(e.name, e.kind) + '<span>' + esc(e.name) + '</span></li>'
              )
              .join('') +
            (w.count > Math.min(4, w.entries.length)
              ? '<li class="more">ほか ' + (w.count - Math.min(4, w.entries.length)) + ' 項目</li>'
              : '') +
            '</ul>'
          meta =
            '<div class="meta"><div class="row2"><span>最終使用</span><span>' +
            (w.last ? fmtAbs(w.last) : '—') +
            '</span></div></div>'
        } else {
          meta =
            '<div class="meta"><div class="row2"><span>' +
            rel(w.last) +
            '</span><span>' +
            w.count +
            ' 項目</span></div></div>'
        }
        const hint =
          '<div class="hint">' +
          (S.edit ? '' : cur ? '使用中のワークスペース' : '<kbd>Enter</kbd> / クリックで切り替え') +
          '</div>'
        f.innerHTML =
          band + '<div class="cbody">' + top + name + mid + meta + (S.edit ? '' : hint) + '</div>'
      }

      function wireForm(el, w) {
        const name = el.querySelector('[data-f=name]'),
          desc = el.querySelector('[data-f=desc]')
        const save = () => {
          const nv = name.value.trim()
          if (w.id !== 'default' && nv === '') {
            name.value = w.name
            return
          } // 非默认工作区名称不能为空：还原
          if (nv !== w.name || desc.value.trim() !== (w.desc || '')) {
            w.name = nv
            w.desc = desc.value.trim() || null
            renderShell()
            el._front = null // 名称变了，侧面状态重绘时也更新
          }
        }
        for (const f of [name, desc]) {
          f.addEventListener('focus', () => (S.editingField = true))
          f.addEventListener('blur', () => {
            S.editingField = false
            save()
          })
          f.addEventListener('keydown', (e) => {
            if (e.isComposing || e.keyCode === 229) return
            if (e.key === 'Escape') {
              // 撤销本字段的修改，焦点回到筛选框（不关闭选择器）
              e.stopPropagation()
              e.preventDefault()
              f.value = f === name ? w.name : w.desc || ''
              $('filter').focus()
            } else if (e.key === 'Enter' && f === name) {
              e.preventDefault()
              e.stopPropagation()
              $('filter').focus()
            } else e.stopPropagation() // 输入框中的 ←→ / 数字 / Enter 不交给圆环
          })
        }
        el.querySelectorAll('[data-color]').forEach((bt) =>
          bt.addEventListener('click', (e) => {
            e.stopPropagation()
            w.color = bt.dataset.color || null
            renderShell()
            el.querySelectorAll('[data-color]').forEach((x) =>
              x.setAttribute('aria-checked', String(x === bt))
            )
            el.querySelector('.band').style.cssText = w.color ? '--c:var(--ws-' + w.color + ')' : ''
          })
        )
        el.querySelectorAll('[data-act]').forEach((bt) =>
          bt.addEventListener('click', (e) => {
            e.stopPropagation()
            const act = bt.dataset.act
            if (act === 'restore') {
              w.name = ''
              renderShell()
              el._front = null
              layout()
            }
            if (act === 'delete') {
              el.classList.add('flipped')
              S.flipped = w.id
              setTimeout(() => el.querySelector('[data-act=cancel]').focus(), 30)
            }
            if (act === 'cancel') {
              el.classList.remove('flipped')
              S.flipped = null
              el.querySelector('[data-act=delete]').focus()
            }
            if (act === 'confirm') removeWs(w)
          })
        )
        el.querySelector('.face.b').addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            e.stopPropagation()
            e.preventDefault()
            el.classList.remove('flipped')
            S.flipped = null
            el.querySelector('[data-act=delete]').focus()
          } else if (e.key !== 'Tab') e.stopPropagation()
        })
      }

      function removeWs(w) {
        const el = cardEls.get(w.id)
        el.style.transition =
          'opacity var(--dur-base) var(--ease-exit), transform var(--dur-base) var(--ease-exit)'
        el.style.opacity = '0'
        el.style.transform += ' scale(0.9)'
        setTimeout(() => {
          S.list = S.list.filter((x) => x !== w)
          if (S.currentId === w.id) S.currentId = 'default' // 原型简化：实际沿用现有删除流程
          el.style.transition = ''
          S.flipped = null
          renderShell()
          rebuild()
          $('filter').focus()
          toast('「' + displayName(w) + '」を削除しました')
        }, 200)
      }

      function createWs() {
        const n = S.list.filter((w) => w.name.startsWith('新しいワークスペース')).length + 1
        const w = {
          id: 'n' + Date.now(),
          name: '新しいワークスペース' + (n > 1 ? ' ' + n : ''),
          desc: null,
          color: null,
          last: null,
          count: 0,
          entries: []
        }
        S.list.push(w)
        rebuild()
        S.pos = visible().findIndex((x) => x.id === w.id)
        layout()
        S.frontSince = performance.now()
        setTimeout(() => {
          const i = cardEls.get(w.id).querySelector('[data-f=name]')
          i.focus()
          i.select()
        }, 60)
      }

      function rotate(delta) {
        const n = visible().length
        if (n < 2) return
        if (S.flipped) {
          const el = cardEls.get(S.flipped)
          el && el.classList.remove('flipped')
          S.flipped = null
        }
        S.pos = (((S.pos + delta) % n) + n) % n
        S.frontSince = performance.now()
        layout()
        announce()
      }
      function rotateTo(i) {
        if (i !== S.pos) rotate(wrapDelta(i, S.pos, visible().length))
      }

      function announce() {
        const v = visible(),
          w = v[S.pos]
        if (!w) return
        $('live').textContent =
          w.id === '__new'
            ? '新しいワークスペースを作成'
            : S.pos +
              1 +
              ' / ' +
              v.length +
              '、' +
              displayName(w) +
              (w.id === S.currentId ? '（使用中）' : '')
      }

      function onCardClick(e, id) {
        const v = visible(),
          i = v.findIndex((w) => w.id === id)
        if (i < 0) return
        if (i !== S.pos) {
          rotateTo(i)
          return
        } // 侧面卡片：只转到正面
        if (e.target.closest('.form, .face.b')) return // 编辑表单内的点击
        if (performance.now() - S.frontSince < FRONT_GUARD_MS) return // 刚转到正面：忽略（误点保护）
        if (id === '__new') {
          createWs()
          return
        }
        if (S.edit) {
          const nm = cardEls.get(id).querySelector('[data-f=name]')
          nm && nm.focus()
          return
        }
        commit(v[i])
      }

      function renderIndicator(v) {
        const ind = $('indicator')
        const real = v.filter((w) => w.id !== '__new')
        if (S.view !== 'ring' || v.length === 0) {
          ind.innerHTML = ''
          return
        }
        if (v.length <= 12) {
          ind.innerHTML = v
            .map(
              (w, i) =>
                '<button tabindex="-1" aria-hidden="true" class="' +
                (i === S.pos ? 'on' : '') +
                (w.id === S.currentId ? ' cur' : '') +
                '" data-i="' +
                i +
                '" title="' +
                esc(w.id === '__new' ? '新規' : displayName(w)) +
                '"></button>'
            )
            .join('')
        } else {
          ind.innerHTML =
            '<span>' +
            (S.pos + 1) +
            ' / ' +
            v.length +
            '</span>' +
            (S.filter
              ? ''
              : '<span class="tip">数が多いときは文字を入力して絞り込むか、リスト表示へ</span>')
        }
        ind
          .querySelectorAll('button')
          .forEach((b) => b.addEventListener('click', () => rotateTo(+b.dataset.i)))
      }

      function renderCount() {
        const real = visible().filter((w) => w.id !== '__new').length
        $('count').textContent = S.filter ? real + ' / ' + S.list.length : S.list.length + ' 件'
      }

      function renderEmpty() {
        $('empty').innerHTML =
          '<strong>「' +
          esc(S.filter) +
          '」に一致するワークスペースはありません</strong><span>名前と説明を検索しています。<kbd>Esc</kbd> で絞り込みを解除</span>'
      }

      function renderFoot() {
        const k = (keys, label) =>
          '<span class="k">' + keys.map((x) => '<kbd>' + x + '</kbd>').join('') + label + '</span>'
        let html = ''
        if (S.edit) {
          html += '<span class="editnote">編集中：クリックや Enter では切り替わりません</span>'
          html +=
            k(['←', '→'], '移動') +
            (S.filter ? '' : k(['Alt', '←→'], '並べ替え')) +
            k(['Tab'], '入力欄へ')
        } else if (S.view === 'ring') {
          html +=
            k(['←', '→'], '回転') +
            k(['Enter'], '切り替え') +
            (S.filter ? '' : k(['1–9'], '直接切り替え')) +
            '<span class="k">文字入力で絞り込み</span>'
        } else {
          html +=
            k(['↑', '↓'], '移動') +
            k(['Enter'], '切り替え') +
            (S.filter ? '' : k(['1–9'], '直接切り替え'))
        }
        html += k(['Esc'], S.filter ? '絞り込み解除' : '閉じる')
        html +=
          '<button class="btn manage" id="manage" style="height:24px;font-size:12px">' +
          svg('layout-list', 'width:14px;height:14px') +
          'ワークスペース一覧を開く</button>'
        $('pfoot').innerHTML = html
        $('manage').addEventListener('click', () => {
          closePicker()
          toast('ワークスペース一覧（既存のページ）を開きます')
        })
      }

      function renderList() {
        const v = visible()
        $('list').innerHTML = v
          .map((w, i) => {
            if (w.id === '__new')
              return (
                '<li class="row" role="option" id="row-__new" data-i="' +
                i +
                '"><span class="bar"></span><span>' +
                svg('plus') +
                '</span><span class="nm">新しいワークスペース</span><span></span><span></span></li>'
              )
            const idx = S.list.indexOf(w),
              num = !S.filter && !S.edit && idx < 9 ? idx + 1 : ''
            return (
              '<li class="row" role="option" id="row-' +
              w.id +
              '" data-i="' +
              i +
              '"><span class="bar" style="' +
              (w.color ? '--c:var(--ws-' + w.color + ')' : '') +
              '"></span>' +
              '<span>' +
              (num ? '<kbd>' + num + '</kbd>' : '') +
              '</span><span style="min-width:0"><div class="nm">' +
              highlight(displayName(w)) +
              '</div>' +
              (S.detail && w.desc ? '<div class="sub">' + esc(w.desc) + '</div>' : '') +
              '</span>' +
              '<span class="tm">' +
              (S.detail ? w.count + ' 項目・' : '') +
              rel(w.last) +
              '</span>' +
              (w.id === S.currentId ? '<span class="pill cur">使用中</span>' : '<span></span>') +
              '</li>'
            )
          })
          .join('')
        ;[...$('list').children].forEach((li) =>
          li.addEventListener('click', () => {
            const i = +li.dataset.i,
              w = visible()[i]
            S.pos = i
            layout()
            if (w.id === '__new') createWsFromList()
            else if (!S.edit) commit(w)
          })
        )
      }
      function createWsFromList() {
        setView('ring')
        createWs()
      }

      function setView(v) {
        S.view = v
        $('vRing').setAttribute('aria-pressed', String(v === 'ring'))
        $('vList').setAttribute('aria-pressed', String(v === 'list'))
        $('stage').hidden = v !== 'ring'
        $('list').hidden = v !== 'list'
        $('filter').setAttribute('aria-controls', v === 'ring' ? 'ring' : 'list')
        layout()
      }

      // ---------- 键盘 ----------
      function onKey(e) {
        if (!S.open || e.isComposing || e.keyCode === 229) return // IME 变换中的按键一律不处理
        const v = visible()
        const inFilter = e.target === $('filter')
        if (e.key === 'Escape') {
          e.preventDefault()
          if (S.filter) {
            S.filter = ''
            $('filter').value = ''
            rebuild()
            S.pos = Math.max(
              0,
              visible().findIndex((w) => w.id === S.currentId)
            )
            layout()
            return
          }
          closePicker()
          return
        }
        if (e.key === 'Tab') {
          trapTab(e)
          return
        }
        if (!inFilter && e.target.closest('.seg2, .sw, .pfoot')) {
          if (e.key === 'Enter' || e.key === ' ') return
        }
        if (S.view === 'ring' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          e.preventDefault()
          const dir = e.key === 'ArrowLeft' ? -1 : 1
          if (e.altKey && S.edit && !S.filter) {
            reorder(dir)
            return
          }
          rotate(dir)
          return
        }
        if (S.view === 'list' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
          e.preventDefault()
          const n = v.length
          if (!n) return
          S.pos = Math.min(n - 1, Math.max(0, S.pos + (e.key === 'ArrowUp' ? -1 : 1)))
          layout()
          announce()
          return
        }
        if ((e.key === 'Home' || e.key === 'End') && inFilter && !S.filter) {
          e.preventDefault()
          const n = v.length
          if (n) {
            S.view === 'ring'
              ? rotateTo(e.key === 'Home' ? 0 : n - 1)
              : ((S.pos = e.key === 'Home' ? 0 : n - 1), layout())
          }
          return
        }
        if (
          e.key === 'Enter' &&
          (inFilter || e.target === document.body || e.target.closest('.panel'))
        ) {
          if (e.target.closest('.seg2, .sw, .pfoot')) return
          e.preventDefault()
          const w = v[S.pos]
          if (!w) return
          if (w.id === '__new') {
            createWs()
            return
          }
          if (S.edit) {
            const nm = cardEls.get(w.id)?.querySelector('[data-f=name]')
            nm && nm.focus()
            return
          }
          commit(w)
          return
        }
        // 1–9：筛选框为空、非编辑模式时直接切换（按 sortOrder，卡片上有编号）
        if (
          /^[1-9]$/.test(e.key) &&
          inFilter &&
          !S.filter &&
          !S.edit &&
          !e.ctrlKey &&
          !e.altKey &&
          !e.metaKey
        ) {
          e.preventDefault()
          const w = S.list[+e.key - 1]
          if (!w) return
          const i = visible().indexOf(w)
          if (S.view === 'ring') rotateTo(i)
          else {
            S.pos = i
            layout()
          }
          commit(w)
          return
        }
        // 其他可打印字符：焦点不在筛选框时转入筛选框（打字即筛选）
        if (
          !inFilter &&
          e.key.length === 1 &&
          !e.ctrlKey &&
          !e.altKey &&
          !e.metaKey &&
          !e.target.matches('input, textarea')
        ) {
          $('filter').focus()
        }
      }
      function trapTab(e) {
        const f = [
          ...$('panel').querySelectorAll(
            'input, textarea, button:not([tabindex="-1"]), [tabindex="0"]'
          )
        ].filter(
          (x) =>
            x.offsetParent !== null &&
            !x.closest('.card:not(.front)') &&
            !x.closest('.flipped .face.f') &&
            !(x.closest('.face.b') && !x.closest('.flipped'))
        )
        if (!f.length) return
        const i = f.indexOf(document.activeElement)
        e.preventDefault()
        const next = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : i === f.length - 1 ? 0 : i + 1
        f[next].focus()
      }
      function reorder(dir) {
        const list = S.list,
          w = visible()[S.pos]
        if (!w || w.id === '__new') return
        const i = list.indexOf(w),
          j = i + dir
        if (j < 0 || j >= list.length) return
        ;[list[i], list[j]] = [list[j], list[i]]
        rebuild()
        S.pos = visible().indexOf(w)
        layout()
        $('live').textContent = displayName(w) + 'を ' + (j + 1) + ' 番目に移動'
      }

      // ---------- 滚轮：只转动 ----------
      let wheelAcc = 0,
        wheelLast = 0,
        wheelIdle
      $('stage').addEventListener(
        'wheel',
        (e) => {
          e.preventDefault()
          const dlt = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
          wheelAcc += e.deltaMode === 1 ? dlt * 40 : dlt
          clearTimeout(wheelIdle)
          wheelIdle = setTimeout(() => (wheelAcc = 0), 180)
          const now = performance.now()
          if (Math.abs(wheelAcc) >= 50 && now - wheelLast > 70) {
            rotate(Math.sign(wheelAcc))
            wheelAcc = 0
            wheelLast = now
          }
        },
        { passive: false }
      )

      // ---------- 事件 ----------
      $('wsBtn').addEventListener('click', (e) =>
        S.open ? closePicker() : openPicker(e.currentTarget)
      )
      $('addrBtn').addEventListener('click', (e) => openPicker(e.currentTarget))
      $('scrim').addEventListener('click', closePicker)
      $('panel').addEventListener('keydown', onKey)
      window.addEventListener('keydown', (e) => {
        if (e.altKey && (e.key === 'w' || e.key === 'W') && !e.ctrlKey) {
          e.preventDefault()
          S.open ? closePicker() : openPicker($('wsBtn'))
        }
      })
      $('filter').addEventListener('input', (e) => {
        if (e.isComposing) return // 变换中先不筛选，确定后（compositionend）再筛
        applyFilter()
      })
      $('filter').addEventListener('compositionend', applyFilter)
      function applyFilter() {
        S.filter = $('filter').value
        rebuild(true)
        announce()
      }
      $('vRing').addEventListener('click', () => setView('ring'))
      $('vList').addEventListener('click', () => setView('list'))
      $('swDetail').addEventListener('click', (e) => {
        S.detail = !S.detail
        e.currentTarget.setAttribute('aria-checked', String(S.detail))
        $('panel').classList.toggle('detail', S.detail)
        renderList()
        layout()
      })
      $('swEdit').addEventListener('click', (e) => {
        S.edit = !S.edit
        e.currentTarget.setAttribute('aria-checked', String(S.edit))
        $('panel').classList.toggle('editing', S.edit)
        const keep = visible()[S.pos]
        rebuild()
        if (keep)
          S.pos = Math.max(
            0,
            visible().findIndex((w) => w.id === keep.id)
          )
        layout()
      })

      function toast(msg) {
        const t = $('toast')
        t.textContent = msg
        t.classList.add('show')
        clearTimeout(toast._t)
        toast._t = setTimeout(() => t.classList.remove('show'), 2200)
      }

      // 原型控制
      function seg(id, fn) {
        $(id)
          .querySelectorAll('button')
          .forEach((b) =>
            b.addEventListener('click', () => {
              $(id)
                .querySelectorAll('button')
                .forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
              fn(b.dataset.v)
            })
          )
      }
      seg('pMode', (v) => $('app').classList.toggle('dark', v === 'dark'))
      seg('pCount', (v) => setCount(+v))
      $('pTheme').addEventListener('change', (e) =>
        $('app').setAttribute('data-theme', e.target.value)
      )
      $('pReduced').addEventListener('change', (e) =>
        $('app').classList.toggle('reduced', e.target.checked)
      )

      setCount(8)
      const qs = new URLSearchParams(location.search)
      if (qs.get('theme')) {
        $('app').dataset.theme = qs.get('theme')
        $('pTheme').value = qs.get('theme')
      }
      if (qs.get('mode') === 'light') $('pMode').querySelector('[data-v=light]').click()
      if (qs.get('count'))
        $('pCount')
          .querySelector('[data-v="' + qs.get('count') + '"]')
          .click()
      if (qs.get('detail')) $('swDetail').click()
      if (qs.get('edit')) $('swEdit').click()
      if (qs.get('open')) openPicker($('wsBtn'))
    </script>
  </body>
</html>
