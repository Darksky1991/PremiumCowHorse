<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 E「重（かさね）」〔抽象〕：两块色面错位叠放，重叠处是更深的一块 = 把分散的资料「重ね」到一起，
       交集就是工作区。右下的小方块是当前焦点。用实色模拟透明叠色（不依赖混合模式，栅格化结果稳定）。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <rect x="2" y="2" width="19" height="19" rx="4.5" style="fill: var(--logo-mid, #6d9adc)"/>
  <rect x="11" y="11" width="19" height="19" rx="4.5" style="fill: var(--logo-base, #3778d7)"/>
  <!-- 交集 [11,21]×[11,21] -->
  <path d="M11 15.5a4.5 4.5 0 0 1 4.5-4.5H21v5.5a4.5 4.5 0 0 1-4.5 4.5H11z" style="fill: var(--logo-base-2, #1f4c9a)"/>
  <rect x="22" y="22" width="5" height="5" rx="1.2" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
