<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 N「文牛（ふみうし）」〔牛头系列・工作区意象〕：文件夹就是牛的脸——文件夹长出一对角、两只耳朵，
       下方是口鼻。「把案件资料装进一个文件夹」与「牛马」合为一体。无底板。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <!-- 角（在文件夹后面） -->
  <path d="M8.5 8.5C6 8 3.8 5.8 3.2 2.2C5.8 4 8.2 4.9 10.8 5.3Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <path d="M23.5 8.5C26 8 28.2 5.8 28.8 2.2C26.2 4 23.8 4.9 21.2 5.3Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 耳 -->
  <path d="M5.5 11.5L1.5 11C1.8 13.4 3.2 14.8 5.5 15Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <path d="M26.5 11.5L30.5 11C30.2 13.4 28.8 14.8 26.5 15Z" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 文件夹 = 脸（左上是文件夹的标签） -->
  <path d="M5 9A2.5 2.5 0 0 1 7.5 6.5H12.6L14.6 9H24.5A2.5 2.5 0 0 1 27 11.5V25A3 3 0 0 1 24 28H8A3 3 0 0 1 5 25Z" style="fill: var(--logo-base, #3778d7)"/>
  <!-- 口鼻 -->
  <rect x="8" y="19" width="16" height="6.5" rx="3.25" style="fill: var(--logo-mid, #6d9adc)"/>
  <circle cx="12.8" cy="22.25" r="1.3" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <circle cx="19.2" cy="22.25" r="1.3" style="fill: var(--logo-base-2, #2a5fb7)"/>
  <!-- 眼 -->
  <circle cx="12" cy="14.6" r="1.4" style="fill: var(--logo-ink, #ffffff)"/>
  <circle cx="20" cy="14.6" r="1.4" style="fill: var(--logo-ink, #ffffff)"/>
  <!-- 耳标 -->
  <rect x="28" y="14" width="2.8" height="3.2" rx="0.6" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
