<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 方案 D「環（わ）」〔抽象〕：三段弧绕着一个点旋转 = 圆环选择器的抽象；
       三段颜色深浅不同，暗示「转到正面的那一张」。中心点是当前案件。无底板。
       style 中的 CSS 变量（logo 系列令牌）供主题自适应，逗号后为静态色 -->
  <title>PremiumCowHorse</title>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <!-- 圆心 (16,16) r=11；每段 80°，段间 40° -->
    <path d="M16 5A11 11 0 0 1 26.83 14.09" style="stroke: var(--logo-base, #3778d7)"/>
    <path d="M25.53 21.5A11 11 0 0 1 12.24 26.34" style="stroke: var(--logo-base-2, #2a5fb7)"/>
    <path d="M6.47 21.5A11 11 0 0 1 8.93 7.57" style="stroke: var(--logo-mid, #6d9adc)"/>
  </g>
  <circle cx="16" cy="16" r="4" style="fill: var(--logo-accent, #f9b73f)"/>
</svg>
