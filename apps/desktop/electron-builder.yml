# 基于 electron-vite 官方模板（Windows 部分），追加 Electron 官方安全建议的 Fuses 配置；只产出 zip 文件夹版
appId: com.premiumcowhorse.app
productName: PremiumCowHorse
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.markdown.config.{js,ts,mjs,cjs}'
  - '!components.json'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!release/*'
  # ssh2 自带 util/pagent.exe（Pageant 辅助程序，本应用不使用）；排除后包内没有可执行文件，也就不会被整体解包（M4-K1）
  - '!**/node_modules/ssh2/util/**'
asarUnpack:
  - resources/**
# https://www.electronjs.org/docs/latest/tutorial/fuses
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  executableName: PremiumCowHorse
  icon: build/icon.ico
  # 只提供免安装的文件夹版（zip，解压即用）。不使用安装程序；也不使用 portable 单文件 exe：
  # 后者每次启动都要把约 300MB 解压到 %TEMP%，实测启动 24–31 秒（文件夹版约 1.3 秒）
  target: zip
  artifactName: ${productName}-${version}-win-${arch}.${ext}
npmRebuild: false
